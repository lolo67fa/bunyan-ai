<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUNYAN</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="shell"><header><p class="eyebrow">BUNYAN AI</p><h1 id="app-title"></h1><p id="app-description"></p></header>
<section id="screen-list" data-testid="screen-list"><div class="toolbar"><h2 id="list-title"></h2><button id="add" data-testid="btn-add" type="button"></button></div><div id="controls" class="controls"></div><div class="table-wrap"><table data-testid="records-table"><thead id="head"></thead><tbody id="rows"></tbody></table></div><p id="empty" data-testid="empty-state"></p><p id="no-results" data-testid="no-results" hidden></p></section>
<section id="screen-form" data-testid="screen-form" hidden><h2 id="form-title"></h2><form id="record-form" novalidate></form><div class="actions"><button id="save" data-testid="btn-save" type="button"></button><button id="cancel" data-testid="btn-cancel" type="button"></button></div></section>
<p id="toast" data-testid="toast" role="status" hidden></p></main><script src="app.js"></script></body></html>
