[pytest]
# Default run = offline mock tests only (free, no API key, no network).
# Live LLM evaluations live in evals/ and must be requested explicitly:
#   BA_RUN_LLM_EVALS=1 pytest evals
testpaths = tests
pythonpath = ../../..
addopts = -ra
markers =
    llm: live LLM evaluation (costs money; needs an API key and BA_RUN_LLM_EVALS=1)
