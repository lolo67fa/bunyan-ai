<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager — QA harness fixture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    QA HARNESS FIXTURE (owner: Sara). Hand-written so the fixed test suite can be
    developed before the Developer agent exists. It is NOT the team's CRUD
    template and passing tests here does NOT prove a generated app works.
    It follows the data-testid rules proposed in architecture contract 0.2.0 §5.
    Add ?bug=no-persist to the URL to simulate a storage defect.
  -->
  <p class="fixture-note">QA harness fixture — not a generated app</p>
  <h1 id="app-title">Task Manager</h1>

  <section id="screen-list" data-testid="screen-list">
    <button type="button" data-testid="btn-add" id="btn-add">Add Task</button>
    <table data-testid="records-table">
      <thead><tr><th>Title</th><th>Due date</th><th>Priority</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p data-testid="empty-state" id="empty-state">No Tasks yet.</p>
  </section>

  <section id="screen-form" data-testid="screen-form" hidden>
    <form id="form" novalidate></form>
    <button type="button" data-testid="btn-save" id="btn-save">Save</button>
    <button type="button" data-testid="btn-cancel" id="btn-cancel">Cancel</button>
  </section>

  <div data-testid="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
