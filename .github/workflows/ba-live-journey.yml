# One full BUNYAN journey with the REAL Business Analyst (owner: Ghala).
#
# Manual only. The real React UI and backend run inside this job; Playwright clicks
# through: idea -> analysis -> review -> one change request -> approve -> Architect,
# Developer, QA (real Playwright), Project Manager -> delivery and ZIP.
#
# Paid requests: at most 2 (the analysis and the one revision), each capped at
# BA_MAX_TOKENS output tokens, with every retry and fallback switched off. If the
# idea needs clarification the journey stops there instead of answering.
# The API key is only given to the step that starts the backend.
name: BA live journey (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-LIVE-JOURNEY to allow at most 2 paid Anthropic requests
        required: true
        default: ""
      idea:
        description: The application idea (Arabic or English)
        required: true
        default: "أبغى موقع لإدارة المخزون أقدر أضيف فيه المنتجات وأعدل كمياتها وأسعارها وأحذف المنتجات."
      feedback:
        description: The one change to request after the first analysis
        required: true
        default: "أضف حقل رقم جوال المورد"

permissions:
  contents: read

concurrency:
  group: ba-live-journey
  cancel-in-progress: false

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BA_MODE: llm
      BA_LLM_PROVIDER: anthropic
      BA_LLM_MODEL: claude-opus-5-5
      BA_LLM_BACKEND: direct
      BA_EFFORT: high
      BA_MAX_RETRIES: "0"        # no second attempt when an answer fails validation
      BA_SDK_MAX_RETRIES: "0"    # no SDK retries on 429/5xx
      BA_FALLBACKS: "off"        # no billed fallback to another model on refusal
      BA_MAX_TOKENS: "32000"     # output cap per request: at most about $0.68 each on claude-opus-5-5
      BA_REQUEST_TIMEOUT: "600"
      BUNYAN_QA: "on"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Require confirmation
        if: inputs.confirm != 'RUN-LIVE-JOURNEY'
        run: |
          echo "::error::Confirmation text did not match RUN-LIVE-JOURNEY. No API call was made."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the backend (Business Analyst direct backend, no CrewAI)
        run: |
          python -m pip install --disable-pip-version-check --quiet fastapi uvicorn httpx \
            -r backend/agents/business_analyst/requirements-direct.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright (QA agent and the journey)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the frontend against this backend
        working-directory: frontend
        env:
          VITE_API_MODE: http
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build

      - name: Start the backend (the only step with the API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 \
            --log-config .github/live/uvicorn-log.json > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/projects/00000000-0000-0000-0000-000000000000 && break
            sleep 1
          done
          grep "Business Analyst:" backend.log

      - name: Start the frontend
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done

      - name: Run the journey through the UI
        env:
          FRONTEND_URL: http://127.0.0.1:4173
          API_URL: http://127.0.0.1:8000
          IDEA: ${{ inputs.idea }}
          FEEDBACK: ${{ inputs.feedback }}
        run: node tests/e2e/live/journey.mjs --out live-journey

      - name: Usage, cost and summary
        if: always()
        run: |
          mkdir -p live-journey
          cp backend.log frontend.log live-journey/ 2>/dev/null || true
          python .github/live/summarize.py backend.log live-journey
          cat live-journey/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the journey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ba-live-journey-${{ github.run_id }}
          path: live-journey/
          if-no-files-found: warn
          retention-days: 30
