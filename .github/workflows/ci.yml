
name: CI Pipeline

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic pytest
          pip install -r backend/agents/business_analyst/requirements.txt

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py tests/test_api_alignment.py -v

      - name: Run pipeline and storage tests
        run: |
          python -m pytest tests/test_pipeline.py tests/test_storage.py tests/test_api_pipeline.py -v

      - name: Run artifact, preview and download tests
        run: |
          python -m pytest tests/test_artifacts_api.py -v

      - name: Test Developer Agent
        run: python tests/smoke_test.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the QA suite (Playwright + Chromium)
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run QA agent tests and real QA on generated apps
        run: |
          python -m pytest backend/agents/qa_tester/tests tests/test_qa_pipeline.py -v -rs
